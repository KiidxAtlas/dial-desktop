[package]
name = "dial-desktop"
version = "0.3.2"
edition = "2024"
license = "MIT"
description = "Native desktop interface for the Dial coding agent"
publish = false

[lib]
name = "dial_desktop"
path = "src/lib.rs"

[[bin]]
name = "dial-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The only link to Dial: the versioned `dial rpc` wire protocol through its Rust client. Pinned to
# a commit of Dial's main branch; bump `rev` deliberately. To develop against a local Dial checkout,
# see "Developing against a local Dial" in README.md.
dial-client = { git = "https://github.com/KiidxAtlas/dial.git", rev = "f5bf3d77c21c05325f4d0e8526b881a96338659d" }
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
png = "0.18"
sha2 = "0.10"
base64 = "0.23"
portable-pty = "0.9"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# The Browser panel's screenshot for the agent (`agent_browser::screenshot`): WebKit's own snapshot.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
mac-usernotifications = { version = "0.3.1", default-features = false }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSPasteboard", "NSView", "NSResponder"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKSnapshotConfiguration"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.8.1"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4.19", default-features = false, features = ["z-with-tokio"] }
tokio = { version = "1", features = ["time"] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
