# Builds, signs and publishes Dial Desktop for macOS, Windows and Linux when a `v*` tag is pushed.
#
# Every platform uploads into one draft release; the last job publishes it, so `latest.json` (what
# installed apps poll for updates) and the website's download links only move to a release once
# every bundle is attached. See "Releasing" in README.md for the one-time secrets and variables.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches every version field
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npm_version=$(jq -r .version package.json)
          tauri_version=$(jq -r .version src-tauri/tauri.conf.json)
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          for version in "$npm_version" "$tauri_version" "$cargo_version"; do
            if [ "$version" != "$tag" ]; then
              echo "::error::package.json ($npm_version), tauri.conf.json ($tauri_version) and Cargo.toml ($cargo_version) must all equal the tag $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - name: Update signing is configured
        env:
          HAS_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          # Without both halves installed apps could not verify (or would never see) this release.
          pubkey=$(jq -r '.plugins.updater.pubkey // ""' src-tauri/tauri.release.conf.json)
          if [ -z "$pubkey" ] || [ "$HAS_PRIVATE_KEY" != "true" ]; then
            echo "::error::Set plugins.updater.pubkey in src-tauri/tauri.release.conf.json and the TAURI_SIGNING_PRIVATE_KEY secret (see README.md › Releasing)"
            exit 1
          fi
          if [ "$HAS_APPLE" != "true" ]; then
            echo "::warning::No Apple Developer ID certificate: the macOS app is only ad-hoc signed, so Gatekeeper asks users to approve its first launch"
          fi

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            guest_config: src-tauri/tauri.macos-guest.conf.json
          - os: macos-latest
            target: x86_64-apple-darwin
            guest_config: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            guest_config: ''
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            guest_config: ''
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.os == 'windows-latest' && 'windows-signing' || 'desktop-build' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      # Tauri imports a certificate whenever APPLE_CERTIFICATE is set, even to an empty string, so
      # the Apple variables exist only when the secrets do. Without them macOS builds are ad-hoc
      # signed ("-"): they run, but Gatekeeper asks users to approve the first launch.
      - name: macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              delimiter="EOF_$(openssl rand -hex 8)"
              printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
            fi
          done

      - name: Authenticate Windows release signer
        if: runner.os == 'Windows'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install Windows signing module
        if: runner.os == 'Windows'
        shell: pwsh
        run: Install-Module ArtifactSigning -RequiredVersion 0.1.8 -Scope CurrentUser -Repository PSGallery -Force -ErrorAction Stop

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          # Signs the update bundles and `latest.json` entries.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Dial Desktop ${{ github.ref_name }}
          releaseBody: |
            Download Dial Desktop for your platform below, or from https://dial.rootatlas.dev/download.
            Installed apps update themselves. The app runs the Dial engine (`dial`); if none is installed it offers to install it, and it keeps the engine updated through `dial update`.
            Terminal only? `curl -fsSL https://dial.rootatlas.dev/install | sh`
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json${{ matrix.guest_config != '' && format(' --config {0}', matrix.guest_config) || '' }}

      - name: Check the bundled virtual Mac helper before publication
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          app=$(find . -type d -path '*/release/bundle/macos/Dial.app' -print -quit)
          test -n "$app"
          sh packaging/macos-guest/verify-bundle.sh "$app"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Refresh the website's release cache
        if: vars.DIAL_WEB_REFRESH_URL != ''
        env:
          URL: ${{ vars.DIAL_WEB_REFRESH_URL }}
          TOKEN: ${{ secrets.DIAL_WEB_REFRESH_TOKEN }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" "$URL" || echo "::warning::website refresh failed; it refetches within an hour"
